
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<div class="container py-5">

    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h2 class="text-center mb-0">Task Manager</h2>
        </div>

        <div class="card-body">

    

            <form id="taskForm">
                <div class="mb-3">
                    <label for="title" class="form-label">Task Title</label>
                    <input type="text" id="title" class="form-control" placeholder="Enter task title" required>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">
                        Description
                    </label>
                    <textarea id="description"class="form-control"placeholder="Enter description"rows="3"></textarea>
                </div>

                <div class="mb-3">
                    <label for="dueDate" class="form-label">Due Date</label>
                    <input type="date" id="dueDate" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="priority" class="form-label">Priority</label>
                    <select id="priority" class="form-select" required>
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>

                <button type="submit" id="saveBtn"
                        class="btn btn-primary">
                    Add Task
                </button>

                <button type="button" id="cancelBtn"
                        class="btn btn-secondary"
                        onclick="resetForm()" hidden>
                    Cancel Edit
                </button>

            </form>

            <p id="message" class="mt-3"></p>

            <hr>

            <h4 class="mb-3">My Tasks</h4>

            <div class="row g-2 mb-3">

                <div class="col-md-6">
                    <input type="text" id="search"class="form-control" placeholder="Search tasks...">
                </div>

                <div class="col-md-6">
                    <select id="filterPriority" class="form-select">
                        <option value="all">All Priorities</option>
                        <option value="high">High Priority</option>
                        <option value="medium">Medium Priority</option>
                        <option value="low">Low Priority</option>
                    </select>
                </div>

            </div>

            <div class="table-responsive">
                <table class="table table-bordered table-striped  table-hover align-middle text-center">

                    <thead class="table-dark">
                        <tr>
                            <th>Sr. No.</th>
                            <th>Task Title</th>
                            <th>Description</th>
                            <th>Due Date</th>
                            <th>Priority</th>
                            <th>Edit</th>
                            <th>Delete</th>
                        </tr>
                    </thead>

                    <tbody id="taskTableBody">
                    </tbody>

                </table>
            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="script.js"></script>

</body>
</html>
